name: Release
# Publishes the version below once; re-running is a no-op if the tag exists.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then echo "v0.1.0 already exists"; exit 0; fi
          gh release create v0.1.0 --target "$GITHUB_SHA" --title "v0.1.0 — first public release" --notes "First public release of the idea-gates Claude Code skill: six feasibility gates scored against your founder profile before any market research, then market analysis, a red-team pass through external LLMs and a build / defer / closed verdict. Includes a founder profile template and optional DataForSEO scripts."
